<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Family</title>
<style>
:root{--bg:#f2f5f3;--ink:#1d2b27;--card:#fff;--ac:#1f4d45;--soft:#dde8e3;--mem:#6b3a5c}
@media(prefers-color-scheme:dark){:root{--bg:#141c1a;--ink:#e8f0ed;--card:#1e2927;--ac:#7fc4b4;--soft:#2b3a37;--mem:#d3a0c2}}
html{font-size:18px}html.big{font-size:24px}

button{font:inherit;background:var(--soft);color:var(--ink);border:0;border-radius:.4rem;padding:.45rem .9rem;cursor:pointer}

main{max-width:900px;margin:0 auto;padding:0 1rem 3rem}
.box{background:var(--card);border-radius:.6rem;padding:1rem;margin:.8rem 0}
a{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid div{background:var(--bg);border-radius:.3rem;min-height:3.2rem;padding:.15rem;font-size:.85rem}
.grid .h{min-height:0;background:none;font-weight:bold}.grid .t{outline:2px solid var(--ac)}
.row{display:flex;gap:.7rem;align-items:center;padding:.3rem 0}.m{color:var(--mem)}
.av{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--soft);display:grid;place-items:center;object-fit:cover;flex:none}
.chip{display:inline-block;background:var(--soft);border-radius:2rem;padding:.2rem .8rem;margin:.2rem;text-decoration:none;color:var(--ink)}
.chip small{opacity:.75}input{font:inherit;width:100%;box-sizing:border-box;padding:.5rem;border-radius:.4rem;border:2px solid var(--soft);background:var(--card);color:var(--ink)}

.tr,.tr ul{list-style:none;padding-left:1.2rem;border-left:2px solid var(--soft)}.tr summary{cursor:pointer;margin:.2rem 0}.chip.me{background:var(--ac);color:var(--bg)}.pdk .pd{justify-content:flex-end}
select{font:inherit;width:100%;padding:.45rem;border-radius:.4rem}
@media print{header,nav,.np{display:none}}
</style></head><body>
<header><h1>Our Family</h1><button id="big">Larger text</button><button onclick="print()">Print</button><button id="out" hidden>Sign out</button></header>
<main>
<div id="login" class="box" hidden><h2>Welcome</h2><p>Please sign in with your Google account to see the family.</p><button id="in" class="on">Sign in with Google</button></div>
<div id="app" hidden>
<nav><button data-t="cal" onclick="location.hash='cal'">Birthdays &amp; Calendar</button><button data-t="people" onclick="location.hash='people'">Everyone</button><button data-t="tree" onclick="location.hash='tree'">Family Tree</button><button data-t="rel" onclick="location.hash='rel'">How are we related?</button></nav>
<div id="view"></div></div>
<footer class="np" style="text-align:center;padding:2.5rem 0 1rem;font-size:.75rem"><a href="admin.html">Editor</a></footer></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC2Bs7mN-7yQfB5w585tDWHmqZtuIIwKUY",authDomain:"family-tree-559cc.firebaseapp.com",projectId:"family-tree-559cc",appId:"1:333199165724:web:a959cfcdbce11d1dc6d2d9"};
const auth=getAuth(initializeApp(cfg)),db=getFirestore(),$=s=>document.querySelector(s);
let P={},M=[],L=[],ym=new Date(),mem=true,ftab="i";

const fmt=d=>d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
const fn=p=>p.first.split(" ")[0],nm=p=>e(p.first+" "+ln(p));
const ln=p=>{if(p.gender!="Female")return p.last;const m=M.filter(x=>!x.end&&(x.p1==p.id||x.p2==p.id)).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0],h=m&&P[m.p1==p.id?m.p2:m.p1];return h&&h.gender=="Male"&&!p.last.endsWith(h.last)?p.last+" "+h.last:p.last};
const lab=(p,m,f,n)=>p.gender=="Male"?m:p.gender=="Female"?f:n;
const uniq=a=>[...new Set(a)];
const byA=(x,y)=>(P[x].birth||"9999").localeCompare(P[y].birth||"9999")||x-y;
const par=i=>L.filter(l=>l.child==i).map(l=>l.parent).sort(byA),kids=i=>L.filter(l=>l.parent==i).map(l=>l.child).sort(byA);
const sp=i=>M.filter(m=>!m.end&&(m.p1==i||m.p2==i)).map(m=>m.p1==i?m.p2:m.p1).sort(byA);
const gone=i=>M.some(m=>m.end&&(m.p1==i||m.p2==i))&&!par(i).length&&!kids(i).length&&!sp(i).length;

const half=(a,b)=>{const x=par(a),y=par(b);return!(x.every(i=>y.includes(i))||y.every(i=>x.includes(i)))};
$("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
$("#out").onclick=()=>signOut(auth);
$("#big").onclick=()=>document.documentElement.classList.toggle("big");
onAuthStateChanged(auth,async u=>{
 $("#login").hidden=!!u;$("#app").hidden=!u;$("#out").hidden=!u;if(!u)return;
 try{const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>d.data());
  const[p,m,l]=await Promise.all([g("people"),g("marriages"),g("links")]);
  p.forEach(x=>P[x.id]=x);M=m;L=l;render()}
 catch{$("#view").innerHTML=`<div class="box">This account (${e(u.email)}) isn't on the family list yet. Ask the family site editor to add your email.</div>`}
});
function age(p,on=new Date()){const b=D(p.birth),d=D(p.death),x=d||on;let a=x.getFullYear()-b.getFullYear();if(x<new Date(x.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function evs(y,m){const o=[];m=new Date(y,m,1);y=m.getFullYear();m=m.getMonth();
 Object.values(P).forEach(p=>{const b=D(p.birth);if(b&&b.getMonth()==m&&!gone(p.id)){const n=y-b.getFullYear(),dead=!!p.death;
  if(n>=0&&(!dead||mem))o.push({d:new Date(y,m,b.getDate()),i:dead?"🕯️":"🎂",id:p.id,t:dead?`${e(fn(p))} would be ${n}`:`${e(fn(p))} turns ${n}`})}});
 M.forEach(x=>{const a=P[x.p1],c=P[x.p2],d=D(x.date);if(d&&d.getMonth()==m&&!a.death&&!c.death&&!x.end&&y>d.getFullYear())
  o.push({d:new Date(y,m,d.getDate()),i:"💍",t:`${e(fn(a))} &amp; ${e(fn(c))}: ${y-d.getFullYear()} years married`})});
 return o.sort((a,b)=>a.d-b.d)}
const li=v=>`<div class="row"><span>${v.i}</span><span><b>${v.d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</b> ${v.id?`<a href="#id${v.id}">${v.t}</a>`:v.t}</span></div>`;
function cal(){const y=ym.getFullYear(),m=ym.getMonth(),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const ev=evs(y,m),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 const up=[0,1,2].flatMap(k=>evs(t0.getFullYear(),t0.getMonth()+k)).filter(v=>v.d>=t0).slice(0,8);
 let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
 for(let d=1;d<=n;d++){const x=ev.filter(v=>v.d.getDate()==d);cells+=`<div class="${t0.getTime()==new Date(y,m,d).getTime()?"t":""}">${d}<br>${x.map(v=>v.i).join("")}</div>`}
 return`<div class="box"><h2>Coming up</h2>${up.map(li).join("")||"Nothing in the next few weeks."}</div>
 <div class="box"><div class="row np"><button onclick="nav(-1)">‹ Back</button><h2 style="flex:1;text-align:center">${ym.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button onclick="nav(1)">Next ›</button></div>
 <div class="grid">${cells}</div><p class="np"><button onclick="tog()" class="${mem?"on":""}">Remembered birthdays 🕯️: ${mem?"On":"Off"}</button></p>
 ${ev.map(li).join("")}</div>`}
function people(){return`<div class="box"><input id="q" placeholder="Search by name" oninput="find(this.value)"><div id="pl">${list("")}</div></div>`}
function list(q){return Object.values(P).filter(p=>(p.first+" "+ln(p)).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first)).map(p=>`<a class="row" style="text-decoration:none;color:inherit" href="#id${p.id}">${av(p)}<span>${nm(p)}${p.death?' <span class="m">🕯️</span>':""}</span></a>`).join("")}
const av=p=>p.photo?`<img class="av" src="${e(p.photo)}" alt="">`:`<span class="av">${e(p.first[0]+p.last[0])}</span>`;
function base(id){const ps=par(id),ss=sibs(id),ks=kids(id),unc=uniq(ps.flatMap(sibs));
 const g=(t,ids,m,f,n,fx)=>({t,it:uniq(ids).sort(byA).filter(x=>x!=id).map(i=>[i,(fx?fx(i):"")+lab(P[i],m,f,n)])});
 const mar=i=>{const x=M.find(m=>(m.p1==id&&m.p2==i)||(m.p2==id&&m.p1==i)),d=D(x&&x.date);return d?d.getFullYear():""};
 return{i:[g("Parents",ps,"Father","Mother","Parent"),
  {t:"Spouses",it:M.filter(m=>m.p1==id||m.p2==id).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).map(m=>{const i=m.p1==id?m.p2:m.p1,y=s=>D(s).getFullYear();return[i,(m.end?"Former ":"")+lab(P[i],"Husband","Wife","Spouse"),m.date?"married "+y(m.date)+(m.end?", ended "+y(m.end):""):""]})},
  g("Siblings",ss,"Brother","Sister","Sibling",i=>half(id,i)?"Half-":""),g("Children",ks,"Son","Daughter","Child")],
 x:[g("Grandparents",ps.flatMap(par),"Grandfather","Grandmother","Grandparent"),
  g("Aunts &amp; Uncles",[...unc,...unc.flatMap(sp)].filter(x=>!ps.includes(x)),"Uncle","Aunt","Aunt/Uncle"),
  g("Nieces &amp; Nephews",ss.flatMap(kids),"Nephew","Niece","Niece/Nephew"),
  g("Cousins",unc.flatMap(kids),"Cousin","Cousin","Cousin"),
  g("Grandchildren",ks.flatMap(kids),"Grandson","Granddaughter","Grandchild")]}}
function profile(id){const p=P[id];if(!p)return'<div class="box">Person not found.</div>';
 const b=D(p.birth),d=D(p.death),G=groups(id)[ftab];
 return`<div class="box"><p class="np"><a href="#people">‹ Everyone</a> · <a href="#tree${id}">Family tree</a></p><div class="row">${av(p)}<div><h2>${nm(p)}</h2>
 ${b?`Born ${fmt(b)}`:"Birthday not added yet"}${d?`<br><span class="m">🕯️ Died ${fmt(d)}${b?`, age ${age(p)}`:""}</span>`:b?` · age ${age(p)}`:""}</div></div></div>
 <nav class="np"><button class="${ftab=="i"?"on":""}" onclick="ft('i')">Immediate Family</button><button class="${ftab=="x"?"on":""}" onclick="ft('x')">Extended Family</button></nav>
 <div class="box">${G.map(g=>g.it.length?`<h3>${g.t}</h3>`+g.it.map(([i,l,n])=>`<a class="chip" href="#id${i}">${nm(P[i])}<br><small>${l}${n?" · "+n:""}${P[i].death?" · 🕯️":""}</small></a>`).join(""):"").join("")||"No relatives on file yet."}</div>`}
const sorted=()=>Object.values(P).sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first));
const me=()=>{try{return+localStorage.me||1}catch{return 1}};
const opts=s=>sorted().map(p=>`<option value="${p.id}" ${p.id==s?"selected":""}>${nm(p)}</option>`).join("");
function groups(id){const G=base(id),all=G.i.concat(G.x),ps=par(id),ks=kids(id),gp=ps.flatMap(par),unc=uniq(ps.flatMap(sibs)),
 has=i=>all.some(g=>g.it.some(r=>r[0]==i)),
 add=(t,ids,m,f,n)=>{const gr=all.find(g=>g.t==t);uniq(ids).filter(i=>i!=id&&!has(i)).forEach(i=>gr.it.push([i,"Step-"+lab(P[i],m,f,n)]))},
 ssb=p=>{const pp=par(p);return pp.flatMap(sp).filter(x=>!pp.includes(x)).flatMap(kids).filter(x=>x!=p&&!sibs(p).includes(x))},
 stp=ps.flatMap(sp).filter(i=>!ps.includes(i)),sc=sp(id).flatMap(kids).filter(i=>!ks.includes(i)),sib=ssb(id),
 su=[...stp.flatMap(sibs),...ps.flatMap(ssb)];
 add("Parents",stp,"Father","Mother","Parent");add("Children",sc,"Son","Daughter","Child");add("Siblings",sib,"Brother","Sister","Sibling");
 add("Grandparents",gp.flatMap(sp),"Grandfather","Grandmother","Grandparent");
 add("Aunts &amp; Uncles",su,"Uncle","Aunt","Aunt/Uncle");
 add("Cousins",[...su,...unc.flatMap(sp)].flatMap(kids),"Cousin","Cousin","Cousin");
 add("Nieces &amp; Nephews",sib.flatMap(kids),"Nephew","Niece","Niece/Nephew");
 add("Grandchildren",sc.flatMap(kids),"Grandson","Granddaughter","Grandchild");all.forEach(g=>g.t!="Spouses"&&g.it.sort((x,y)=>byA(x[0],y[0])));
 const seen=()=>new Set([id,...all.flatMap(g=>g.it.map(r=>r[0]))]),
 nx=(t,m,f,n)=>{const gr=all.find(g=>g.t==t),s=seen();gr.it=gr.it.flatMap(r=>[r,...sp(r[0]).filter(x=>!s.has(x)&&s.add(x)).map(x=>[x,lab(P[x],m,f,n),"married to "+fn(P[r[0]])])])};
 nx("Children","Son-in-law","Daughter-in-law","Child-in-law");nx("Siblings","Brother-in-law","Sister-in-law","Sibling-in-law");
 all.find(g=>g.t=="Aunts &amp; Uncles").it.forEach(r=>{const u=unc.find(x=>sp(x).includes(r[0]));if(u&&!unc.includes(r[0]))r[2]="married to "+fn(P[u])});
 const s2=seen(),sf=[];sp(id).forEach(s=>{par(s).forEach(x=>sf.push([x,lab(P[x],"Father-in-law","Mother-in-law","Parent-in-law"),fn(P[s])+"'s "+lab(P[x],"father","mother","parent")]));sibs(s).forEach(x=>sf.push([x,lab(P[x],"Brother-in-law","Sister-in-law","Sibling-in-law"),fn(P[s])+"'s "+lab(P[x],"brother","sister","sibling")]))});
 G.i.push({t:"Spouse's Family",it:sf.filter(r=>!s2.has(r[0]))});return G}
const gg=n=>"great-".repeat(Math.max(0,n)),ord=n=>["","1st","2nd","3rd"][n]||n+"th";
function anc(i){const m={[i]:0};let f=[i];for(let d=1;d<9&&f.length;d++){f=uniq(f.flatMap(par)).filter(x=>!(x in m));f.forEach(x=>m[x]=d)}return m}
function relText(a,b,deep){if(a==b)return"the same person";
 const G=groups(a),hit=G.i.concat(G.x).flatMap(g=>g.it).find(r=>r[0]==b);if(hit)return hit[1].toLowerCase();
 const A=anc(a),B=anc(b),c=Object.keys(A).filter(k=>k in B).sort((x,y)=>A[x]+B[x]-A[y]-B[y]),p=P[b];
 if(c.length){const da=A[c[0]],db=B[c[0]];
  return db==0?(da>1?gg(da-2)+"grand":"")+lab(p,"father","mother","parent"):da==0?(db>1?gg(db-2)+"grand":"")+lab(p,"son","daughter","child"):
   da==1?gg(db-2)+lab(p,"nephew","niece","niece/nephew"):db==1?gg(da-2)+lab(p,"uncle","aunt","aunt/uncle"):
   `${ord(Math.min(da,db)-1)} cousin${da==db?"":` ${Math.abs(da-db)==1?"once":Math.abs(da-db)==2?"twice":Math.abs(da-db)+" times"} removed`}`}
 if(deep)return null;
 for(const s of sp(a)){const r=relText(s,b,1);if(r)return`${lab(P[s],"husband","wife","spouse")}'s ${r}`}
 for(const s of sp(b)){const r=relText(a,s,1);if(r)return`${r}'s ${lab(p,"husband","wife","spouse")}`}
 return null}
function path(a,b){const prev={[a]:null},q=[a];while(q.length){const i=q.shift();if(i==b)break;
 [...par(i),...kids(i),...M.filter(m=>m.p1==i||m.p2==i).map(m=>m.p1==i?m.p2:m.p1)].forEach(n=>{if(!(n in prev)){prev[n]=i;q.push(n)}})}
 if(!(b in prev))return"";const o=[];for(let i=b;i!=null;i=prev[i])o.unshift(e(fn(P[i])));return o.join(" → ")}
let RA=0,RB=0;
function rr(){const A=P[RA],B=P[RB];if(RA==RB)return"That's the same person!";const x=relText(RA,RB),y=relText(RB,RA),pa=path(RA,RB);
 return x?`<p><b>${nm(B)}</b> is ${e(fn(A))}'s <b>${x}</b>.</p>${y?`<p><b>${nm(A)}</b> is ${e(fn(B))}'s ${y}.</p>`:""}<p class="m">Connection: ${pa}</p>`:pa?`<p>Connected through marriage or family:</p><p>${pa}</p>`:"<p>No family connection found.</p>"}
function related(){RA=RA||me();RB=RB||+Object.keys(P).find(k=>k!=RA);
 return`<div class="box"><h2>How are we related?</h2><label>Person 1<select id="ra" onchange="rg()">${opts(RA)}</select></label><label>Person 2<select id="rb" onchange="rg()">${opts(RB)}</select></label><div id="rr">${rr()}</div></div>`}
const yrs=p=>{const b=D(p.birth),d=D(p.death);return(b?b.getFullYear():"?")+(d?"–"+d.getFullYear():"")};
const node=(i,r)=>`<a class="chip${r?" me":""}" href="#tree${i}">${nm(P[i])}<br><small>${yrs(P[i])}</small></a>`;
function tree(id){if(!P[id])id=me();
 const up=(i,d)=>`<div class="pd">${d<3&&par(i).length?`<div class="pdk">${par(i).slice().sort((a,b)=>(P[a].gender=="Male"?0:1)-(P[b].gender=="Male"?0:1)).map(x=>up(x,d+1)).join("")}</div>`:""}${node(i,d==0)}</div>`,
 dn=(i,d)=>{const k=kids(i),h=node(i)+sp(i).map(s=>`<span class="m"> &amp; </span>`+node(s)).join("");
  return k.length&&d<5?`<li><details ${d<2?"open":""}><summary>${h}</summary><ul>${k.map(c=>dn(c,d+1)).join("")}</ul></details></li>`:`<li>${h}</li>`},k=kids(id);
 return`<div class="box"><label>Center the tree on<select onchange="location.hash='tree'+this.value">${opts(id)}</select></label><p class="m">Tap a name to center the tree on that person. <a href="#id${id}">Open ${e(fn(P[id]))}'s profile</a></p></div>
 <div class="box"><h2>Ancestors</h2><div style="overflow-x:auto">${up(id,0)}</div></div>
 <div class="box"><h2>${nm(P[id])}${sp(id).length?" &amp; "+sp(id).map(s=>nm(P[s])).join(", "):""}</h2>${k.length?`<ul class="tr">${k.map(c=>dn(c,1)).join("")}</ul>`:"<p>No children on file.</p>"}</div>`}
function render(){const h=location.hash.slice(1)||"cal";
 const t=h.startsWith("tree")?"tree":h=="rel"?"rel":h=="cal"?"cal":"people";

 $("#view").innerHTML=t=="tree"?tree(+h.slice(4)||me()):t=="rel"?related():t=="cal"?cal():h=="people"?people():profile(+h.slice(2))}
Object.assign(window,{nav:d=>{ym=new Date(ym.getFullYear(),ym.getMonth()+d,1);render()},tog:()=>{mem=!mem;render()},ft:t=>{ftab=t;render()},find:v=>{$("#pl").innerHTML=list(v)},rg:()=>{RA=+$("#ra").value;RB=+$("#rb").value;try{localStorage.me=RA}catch{}$("#rr").innerHTML=rr()}});
addEventListener("hashchange",()=>Object.keys(P).length&&render());
</script></body></html>
