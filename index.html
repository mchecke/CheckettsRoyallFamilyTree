<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Family</title>
<style>
:root{--bg:#f2f5f3;--ink:#1d2b27;--card:#fff;--ac:#1f4d45;--soft:#dde8e3;--mem:#6b3a5c}
@media(prefers-color-scheme:dark){:root{--bg:#141c1a;--ink:#e8f0ed;--card:#1e2927;--ac:#7fc4b4;--soft:#2b3a37;--mem:#d3a0c2}}
html{font-size:18px}html.big{font-size:24px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Charter,"Iowan Old Style",Georgia,serif;line-height:1.55}
header{background:var(--card);border-bottom:4px solid var(--ac);padding:.7rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
h1{font-size:1.5rem;margin:0;flex:1;color:var(--ac)}h2{margin:.2rem 0}
button{font:inherit;background:var(--soft);color:var(--ink);border:0;border-radius:.4rem;padding:.45rem .9rem;cursor:pointer}
button.on{background:var(--ac);color:var(--bg)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mem);outline-offset:2px}
nav{display:flex;gap:.4rem;padding:.7rem 1rem;flex-wrap:wrap}
main{max-width:900px;margin:0 auto;padding:0 1rem 3rem}
.box{background:var(--card);border-radius:.6rem;padding:1rem;margin:.8rem 0}
a{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid div{background:var(--bg);border-radius:.3rem;min-height:3.2rem;padding:.15rem;font-size:.85rem}
.grid .h{min-height:0;background:none;font-weight:bold}.grid .t{outline:2px solid var(--ac)}
.row{display:flex;gap:.7rem;align-items:center;padding:.3rem 0}.m{color:var(--mem)}
.av{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--soft);display:grid;place-items:center;object-fit:cover;flex:none}
.chip{display:inline-block;background:var(--soft);border-radius:2rem;padding:.2rem .8rem;margin:.2rem;text-decoration:none;color:var(--ink)}
.chip small{opacity:.75}input{font:inherit;width:100%;box-sizing:border-box;padding:.5rem;border-radius:.4rem;border:2px solid var(--soft);background:var(--card);color:var(--ink)}
@media print{header,nav,.np{display:none}}
</style></head><body>
<header><h1>Our Family</h1><button id="big">Larger text</button><button onclick="print()">Print</button><button id="out" hidden>Sign out</button></header>
<main>
<div id="login" class="box" hidden><h2>Welcome</h2><p>Please sign in with your Google account to see the family.</p><button id="in" class="on">Sign in with Google</button></div>
<div id="app" hidden>
<nav><button data-t="cal" onclick="location.hash='cal'">Birthdays &amp; Calendar</button><button data-t="people" onclick="location.hash='people'">Everyone</button></nav>
<div id="view"></div></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"PASTE",authDomain:"PASTE",projectId:"PASTE",appId:"PASTE"};
const auth=getAuth(initializeApp(cfg)),db=getFirestore(),$=s=>document.querySelector(s);
let P={},M=[],L=[],ym=new Date(),mem=true,ftab="i";
const e=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const D=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
const fmt=d=>d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
const fn=p=>p.first.split(" ")[0],nm=p=>e(p.first+" "+p.last);
const lab=(p,m,f,n)=>p.gender=="Male"?m:p.gender=="Female"?f:n;
const uniq=a=>[...new Set(a)];
const par=i=>L.filter(l=>l.child==i).map(l=>l.parent),kids=i=>L.filter(l=>l.parent==i).map(l=>l.child);
const sp=i=>M.filter(m=>m.p1==i||m.p2==i).map(m=>m.p1==i?m.p2:m.p1);
const sibs=i=>uniq(par(i).flatMap(kids)).filter(x=>x!=i);
const half=(a,b)=>{const x=par(a),y=par(b);return!(x.every(i=>y.includes(i))||y.every(i=>x.includes(i)))};
$("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
$("#out").onclick=()=>signOut(auth);
$("#big").onclick=()=>document.documentElement.classList.toggle("big");
onAuthStateChanged(auth,async u=>{
 $("#login").hidden=!!u;$("#app").hidden=!u;$("#out").hidden=!u;if(!u)return;
 try{const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>d.data());
  const[p,m,l]=await Promise.all([g("people"),g("marriages"),g("links")]);
  p.forEach(x=>P[x.id]=x);M=m;L=l;render()}
 catch{$("#view").innerHTML=`<div class="box">This account (${e(u.email)}) isn't on the family list yet. Ask the family site editor to add your email.</div>`}
});
function age(p,on=new Date()){const b=D(p.birth),d=D(p.death),x=d||on;let a=x.getFullYear()-b.getFullYear();if(x<new Date(x.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function evs(y,m){const o=[];m=new Date(y,m,1);y=m.getFullYear();m=m.getMonth();
 Object.values(P).forEach(p=>{const b=D(p.birth);if(b&&b.getMonth()==m){const n=y-b.getFullYear(),dead=!!p.death;
  if(n>=0&&(!dead||mem))o.push({d:new Date(y,m,b.getDate()),i:dead?"🕯️":"🎂",id:p.id,t:dead?`${e(fn(p))} would be ${n}`:`${e(fn(p))} turns ${n}`})}});
 M.forEach(x=>{const a=P[x.p1],c=P[x.p2],d=D(x.date);if(d&&d.getMonth()==m&&!a.death&&!c.death&&y>d.getFullYear())
  o.push({d:new Date(y,m,d.getDate()),i:"💍",t:`${e(fn(a))} &amp; ${e(fn(c))}: ${y-d.getFullYear()} years married`})});
 return o.sort((a,b)=>a.d-b.d)}
const li=v=>`<div class="row"><span>${v.i}</span><span><b>${v.d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</b> ${v.id?`<a href="#id${v.id}">${v.t}</a>`:v.t}</span></div>`;
function cal(){const y=ym.getFullYear(),m=ym.getMonth(),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const ev=evs(y,m),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 const up=[0,1,2].flatMap(k=>evs(t0.getFullYear(),t0.getMonth()+k)).filter(v=>v.d>=t0).slice(0,8);
 let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
 for(let d=1;d<=n;d++){const x=ev.filter(v=>v.d.getDate()==d);cells+=`<div class="${t0.getTime()==new Date(y,m,d).getTime()?"t":""}">${d}<br>${x.map(v=>v.i).join("")}</div>`}
 return`<div class="box"><h2>Coming up</h2>${up.map(li).join("")||"Nothing in the next few weeks."}</div>
 <div class="box"><div class="row np"><button onclick="nav(-1)">‹ Back</button><h2 style="flex:1;text-align:center">${ym.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button onclick="nav(1)">Next ›</button></div>
 <div class="grid">${cells}</div><p class="np"><button onclick="tog()" class="${mem?"on":""}">Remembered birthdays 🕯️: ${mem?"On":"Off"}</button></p>
 ${ev.map(li).join("")}</div>`}
function people(){return`<div class="box"><input id="q" placeholder="Search by name" oninput="find(this.value)"><div id="pl">${list("")}</div></div>`}
function list(q){return Object.values(P).filter(p=>(p.first+" "+p.last).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first)).map(p=>`<a class="row" style="text-decoration:none;color:inherit" href="#id${p.id}">${av(p)}<span>${nm(p)}${p.death?' <span class="m">🕯️</span>':""}</span></a>`).join("")}
const av=p=>p.photo?`<img class="av" src="${e(p.photo)}" alt="">`:`<span class="av">${e(p.first[0]+p.last[0])}</span>`;
function groups(id){const ps=par(id),ss=sibs(id),ks=kids(id),unc=uniq(ps.flatMap(sibs));
 const g=(t,ids,m,f,n,fx)=>({t,it:uniq(ids).filter(x=>x!=id).map(i=>[i,(fx?fx(i):"")+lab(P[i],m,f,n)])});
 const mar=i=>{const x=M.find(m=>(m.p1==id&&m.p2==i)||(m.p2==id&&m.p1==i)),d=D(x&&x.date);return d?d.getFullYear():""};
 return{i:[g("Parents",ps,"Father","Mother","Parent"),
  {t:"Spouses",it:uniq(sp(id)).map(i=>[i,lab(P[i],"Husband","Wife","Spouse"),mar(i)?"married "+mar(i):""])},
  g("Siblings",ss,"Brother","Sister","Sibling",i=>half(id,i)?"Half-":""),g("Children",ks,"Son","Daughter","Child")],
 x:[g("Grandparents",ps.flatMap(par),"Grandfather","Grandmother","Grandparent"),
  g("Aunts &amp; Uncles",[...unc,...unc.flatMap(sp)].filter(x=>!ps.includes(x)),"Uncle","Aunt","Aunt/Uncle"),
  g("Nieces &amp; Nephews",ss.flatMap(kids),"Nephew","Niece","Niece/Nephew"),
  g("Cousins",unc.flatMap(kids),"Cousin","Cousin","Cousin"),
  g("Grandchildren",ks.flatMap(kids),"Grandson","Granddaughter","Grandchild")]}}
function profile(id){const p=P[id];if(!p)return'<div class="box">Person not found.</div>';
 const b=D(p.birth),d=D(p.death),G=groups(id)[ftab];
 return`<div class="box"><p class="np"><a href="#people">‹ Everyone</a></p><div class="row">${av(p)}<div><h2>${nm(p)}</h2>
 ${b?`Born ${fmt(b)}`:"Birthday not added yet"}${d?`<br><span class="m">🕯️ Died ${fmt(d)}${b?`, age ${age(p)}`:""}</span>`:b?` · age ${age(p)}`:""}</div></div></div>
 <nav class="np"><button class="${ftab=="i"?"on":""}" onclick="ft('i')">Immediate Family</button><button class="${ftab=="x"?"on":""}" onclick="ft('x')">Extended Family</button></nav>
 <div class="box">${G.map(g=>g.it.length?`<h3>${g.t}</h3>`+g.it.map(([i,l,n])=>`<a class="chip" href="#id${i}">${nm(P[i])}<br><small>${l}${n?" · "+n:""}${P[i].death?" · 🕯️":""}</small></a>`).join(""):"").join("")||"No relatives on file yet."}</div>`}
function render(){const h=location.hash.slice(1)||"cal";
 document.querySelectorAll("nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==(h=="cal"?"cal":"people")));
 $("#view").innerHTML=h=="cal"?cal():h=="people"?people():profile(+h.slice(2))}
Object.assign(window,{nav:d=>{ym=new Date(ym.getFullYear(),ym.getMonth()+d,1);render()},tog:()=>{mem=!mem;render()},ft:t=>{ftab=t;render()},find:v=>{$("#pl").innerHTML=list(v)}});
addEventListener("hashchange",()=>Object.keys(P).length&&render());
</script></body></html>
